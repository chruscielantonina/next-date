services:
  mysql:
    image: mysql:8.0
    container_name: next-date-mysql
    environment:
      MYSQL_DATABASE: next-date
      MYSQL_USER: next-date-user
      MYSQL_PASSWORD: next-date-pass
      MYSQL_ROOT_PASSWORD: next-date-pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pnext-date-pass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: .
    container_name: nextdate-backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/next-date?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: next-date-user
      SPRING_DATASOURCE_PASSWORD: next-date-pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    restart: on-failure

#  frontend:
#    build: ../frontend
#    container_name: nextdate-frontend
#    ports:
#      - "3000:3000"
#    depends_on:
#      - backend

volumes:
  mysql_data: