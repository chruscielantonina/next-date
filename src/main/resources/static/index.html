<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextDate - Your Appointment Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">

<div class="max-w-6xl mx-auto p-6">
    <header class="mb-10 text-center">
        <h1 class="text-4xl font-extrabold text-indigo-600 tracking-tight">NextDate 🗓️</h1>
        <p class="text-slate-500 mt-2">Never miss another appointment</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit">
            <h2 class="text-xl font-bold mb-4 text-slate-700">Add New Appointment</h2>

            <form id="appointmentForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Appointment Name</label>
                    <input type="text" id="name" required placeholder="e.g., Dentist, Hairdresser, Gym"
                           class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Last Appointment Date</label>
                    <input type="date" id="previousDate" required
                           class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Interval</label>
                        <input type="number" id="timePeriod" min="1" required placeholder="6"
                               class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Unit</label>
                        <select id="timeUnit" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="DAYS">Days</option>
                            <option value="WEEKS">Weeks</option>
                            <option value="MONTHS" selected>Months</option>
                            <option value="YEARS">Years</option>
                        </select>
                    </div>
                </div>

                <div class="pt-2">
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="notificationEnabled" class="sr-only peer" checked>
                        <div class="relative w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                        <span class="ms-3 text-sm font-medium text-slate-600">Notifications enabled</span>
                    </label>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Remind me how many days before?</label>
                    <input type="number" id="daysBeforeNotification" min="1" value="7"
                           class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-xl transition duration-200 shadow-sm shadow-indigo-100">
                    Save Appointment
                </button>
            </form>
        </div>

        <div class="lg:col-span-2">
            <h2 class="text-xl font-bold mb-4 text-slate-700">Your Upcoming Appointments</h2>
            <div id="appointmentsList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api/appointments';

    // 1. Fetch appointments from the backend
    async function loadAppointments() {
        try {
            const response = await fetch(API_URL);
            const appointments = await response.json();
            const listContainer = document.getElementById('appointmentsList');
            listContainer.innerHTML = '';

            if(appointments.length === 0) {
                listContainer.innerHTML = `<p class="text-slate-400 col-span-2 text-center py-10 bg-white rounded-2xl border border-dashed border-slate-200">No appointments scheduled yet. Add your first one!</p>`;
                return;
            }

            appointments.forEach(app => {
                listContainer.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-lg text-slate-800">${app.name}</h3>
                                <span class="px-2 py-1 text-xs font-semibold rounded-md bg-indigo-50 text-indigo-600">
                                    Every ${app.timePeriod} ${app.timeUnit === 'MONTHS' ? 'mo.' : app.timeUnit === 'DAYS' ? 'days' : app.timeUnit === 'WEEKS' ? 'wk.' : 'yr.'}
                                </span>
                            </div>
                            <p class="text-xs text-slate-400 mb-4">Previous: ${app.previousDate}</p>

                            <div class="bg-emerald-50 text-emerald-700 p-3 rounded-xl mb-4 text-center">
                                <span class="text-xs block uppercase tracking-wider font-semibold opacity-75">Next Appointment</span>
                                <span class="text-xl font-black">${app.nextDate}</span>
                            </div>
                        </div>

                        <div class="flex justify-between items-center pt-2 border-t border-slate-50">
                            <span class="text-xs text-slate-400">
                                🔔 ${app.notificationEnabled ? `Reminder: ${app.daysBeforeNotification} days before` : 'Notifications disabled'}
                            </span>
                            <button onclick="deleteAppointment('${app.id}')" class="text-red-500 hover:text-red-700 text-sm font-medium transition">
                                Delete
                            </button>
                        </div>
                    </div>
                `;
            });
        } catch (error) {
            console.error("Error fetching data:", error);
        }
    }

    // 2. Add new appointment (Form -> POST)
    document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const newAppointment = {
            name: document.getElementById('name').value,
            previousDate: document.getElementById('previousDate').value,
            timePeriod: parseInt(document.getElementById('timePeriod').value),
            timeUnit: document.getElementById('timeUnit').value,
            notificationEnabled: document.getElementById('notificationEnabled').checked,
            daysBeforeNotification: parseInt(document.getElementById('daysBeforeNotification').value)
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newAppointment)
            });

            if (response.ok) {
                document.getElementById('appointmentForm').reset();
                loadAppointments(); // Refresh the list
            }
        } catch (error) {
            console.error("Error adding appointment:", error);
        }
    });

    // 3. Delete appointment (DELETE)
    async function deleteAppointment(id) {
        if (confirm("Are you sure you want to delete this appointment?")) {
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadAppointments(); // Refresh the list
                }
            } catch (error) {
                console.error("Error deleting appointment:", error);
            }
        }
    }

    // Initial load
    loadAppointments();
</script>
</body>
</html>
