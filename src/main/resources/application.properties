spring.application.name=NextDate
spring.datasource.url=jdbc:mysql://localhost:3306/next-date?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=next-date-user
spring.datasource.password=next-date-pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# In production set the JWT_SECRET environment variable (at least 32 characters).
# The value after the colon is only a default for local development.
jwt.secret=${JWT_SECRET:qwertyuiop234567asdfghjkl456789asdfg3456zxcvbnm}
jwt.expiration=86400000